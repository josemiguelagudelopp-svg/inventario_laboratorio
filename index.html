<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Lab - Control Total</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 pb-20">
    <div class="max-w-md mx-auto space-y-4">
        <header class="text-center pt-2">
            <h1 class="text-2xl font-bold text-emerald-400">Inventario Lab</h1>
            <p class="text-xs text-emerald-500 font-semibold mt-0.5">● Sincronizado en tiempo real</p>
        </header>

        <!-- Botón para Agregar Nuevo Elemento -->
        <button onclick="abrirModalFormulario()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 py-3 rounded-xl font-bold shadow-lg transition-all text-sm flex items-center justify-center gap-2">
            <span>➕</span> Agregar Nuevo Elemento
        </button>

        <!-- Barra de Búsqueda Retroactiva -->
        <div class="relative">
            <input type="text" id="buscador" placeholder="🔍 Buscar elemento..." 
                class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-100 placeholder-slate-500 shadow-inner">
        </div>

        <!-- Lista de Inventario -->
        <div id="lista-inventario" class="space-y-3">
            <!-- Los elementos se cargan dinámicamente aquí -->
        </div>
    </div>

    <!-- MODAL PARA CREAR / EDITAR ELEMENTO -->
    <div id="modal-form" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl">
            <h2 id="modal-titulo" class="text-lg font-bold text-emerald-400">Nuevo Elemento</h2>
            <input type="hidden" id="elem-id">
            
            <div class="space-y-1">
                <label class="text-xs text-slate-400">Nombre del elemento</label>
                <input type="text" id="elem-nombre" placeholder="Ej: Guantes de látex" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-xs text-slate-400">Cantidad actual</label>
                    <input type="number" id="elem-cantidad" placeholder="Ej: 25" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-slate-400">Stock Mínimo (Alerta)</label>
                    <input type="number" id="elem-minimo" placeholder="Ej: 5" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs text-slate-400">Unidad de medida (opcional)</label>
                <input type="text" id="elem-unidad" placeholder="Ej: unidades, ml, gramos" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="cerrarModalFormulario()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-xl text-sm font-semibold">Cancelar</button>
                <button onclick="guardarElemento()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-sm font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE CONEXIÓN Y LÓGICA -->
    <script>
        // TUS CREDENCIALES EXACTAS DE SUPABASE
        const SUPABASE_URL = 'https://obcwirxjvypxdpxudyqu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_nFUde6igy8iYfKScAMFhKQ_K1e7ot-d';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let inventarioCache = [];

        async function cargarInventario() {
            const { data, error } = await supabase.from('inventario').select('*');
            if (error) {
                console.error('Error cargando inventario:', error);
                return;
            }
            inventarioCache = data || [];
            filtrarYRenderizar();
        }

        function renderizar(items) {
            const contenedor = document.getElementById('lista-inventario');
            contenedor.innerHTML = '';

            if (items.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-slate-500 py-8 text-sm">No se encontraron elementos.</p>';
                return;
            }

            // Ordenar: primero los críticos (cantidad <= stock_minimo), luego alfabéticamente
            items.sort((a, b) => {
                const aCritico = a.cantidad <= a.stock_minimo ? 0 : 1;
                const bCritico = b.cantidad <= b.stock_minimo ? 0 : 1;
                if (aCritico !== bCritico) return aCritico - bCritico;
                return a.nombre.localeCompare(b.nombre);
            });

            items.forEach(item => {
                const esCritico = item.cantidad <= item.stock_minimo;
                const card = document.createElement('div');
                card.className = `p-4 rounded-2xl border flex flex-col gap-3 shadow-md transition-all ${esCritico ? 'bg-red-950/40 border-red-800' : 'bg-slate-800 border-slate-700'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-slate-100 text-base">${item.nombre}</h3>
                            <p class="text-sm mt-0.5 ${esCritico ? 'text-red-400 font-bold' : 'text-slate-400'}">
                                Cantidad: ${item.cantidad} ${item.unidad || ''} ${esCritico ? '⚠️ [CRÍTICO]' : ''}
                            </p>
                        </div>
                        <!-- Botón Eliminar Directo (Sin Advertencia) -->
                        <button onclick="eliminarElemento(${item.id})" class="text-slate-400 hover:text-red-400 p-1 rounded-lg text-lg">🗑️</button>
                    </div>

                    <div class="flex items-center justify-between pt-1 border-t border-slate-700/50">
                        <button onclick="abrirModalFormulario(${item.id})" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg font-semibold text-slate-300">✏️ Editar</button>
                        
                        <div class="flex gap-2">
                            <button onclick="modificarCantidad(${item.id}, -1)" class="bg-red-600 hover:bg-red-500 active:scale-95 w-9 h-9 rounded-xl font-bold text-lg flex items-center justify-center shadow">&#8722;</button>
                            <button onclick="modificarCantidad(${item.id}, 1)" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 w-9 h-9 rounded-xl font-bold text-lg flex items-center justify-center shadow">&#43;</button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function filtrarYRenderizar() {
            const texto = document.getElementById('buscador').value.toLowerCase().trim();
            const filtrados = inventarioCache.filter(item => item.nombre.toLowerCase().includes(texto));
            renderizar(filtrados);
        }

        document.getElementById('buscador').addEventListener('input', filtrarYRenderizar);

        async function modificarCantidad(id, cambio) {
            const item = inventarioCache.find(i => i.id === id);
            if (!item) return;
            
            const nuevaCantidad = Math.max(0, item.cantidad + cambio);

            const { error } = await supabase
                .from('inventario')
                .update({ cantidad: nuevaCantidad })
                .eq('id', id);

            if (error) {
                alert('Error al actualizar');
            } else {
                item.cantidad = nuevaCantidad;
                filtrarYRenderizar();
            }
        }

        async function eliminarElemento(id) {
            const { error } = await supabase.from('inventario').delete().eq('id', id);
            if (error) {
                alert('Error al eliminar');
            } else {
                cargarInventario();
            }
        }

        // --- Funciones del Modal de Creación / Edición ---
        function abrirModalFormulario(id = null) {
            document.getElementById('modal-form').classList.remove('hidden');
            document.getElementById('modal-form').classList.add('flex');
            
            if (id) {
                const item = inventarioCache.find(i => i.id === id);
                document.getElementById('modal-titulo').innerText = "Editar Elemento";
                document.getElementById('elem-id').value = item.id;
                document.getElementById('elem-nombre').value = item.nombre;
                document.getElementById('elem-cantidad').value = item.cantidad;
                document.getElementById('elem-minimo').value = item.stock_minimo;
                document.getElementById('elem-unidad').value = item.unidad || '';
            } else {
                document.getElementById('modal-titulo').innerText = "Nuevo Elemento";
                document.getElementById('elem-id').value = '';
                document.getElementById('elem-nombre').value = '';
                document.getElementById('elem-cantidad').value = '';
                document.getElementById('elem-minimo').value = '';
                document.getElementById('elem-unidad').value = '';
            }
        }

        function cerrarModalFormulario() {
            document.getElementById('modal-form').classList.remove('flex');
            document.getElementById('modal-form').classList.add('hidden');
        }

        async function guardarElemento() {
            const id = document.getElementById('elem-id').value;
            const nombre = document.getElementById('elem-nombre').value.trim();
            const cantidad = parseInt(document.getElementById('elem-cantidad').value);
            const stock_minimo = parseInt(document.getElementById('elem-minimo').value);
            const unidad = document.getElementById('elem-unidad').value.trim();

            if (!nombre || isNaN(cantidad) || isNaN(stock_minimo)) {
                alert('Por favor completa los campos obligatorios correctamente.');
                return;
            }

            const datos = { nombre, cantidad, stock_minimo, unidad: unidad || null };

            if (id) {
                // Actualizar existente
                const { error } = await supabase.from('inventario').update(datos).eq('id', id);
                if (error) alert('Error al actualizar');
            } else {
                // Crear nuevo
                const { error } = await supabase.from('inventario').insert([datos]);
                if (error) alert('Error al crear');
            }

            cerrarModalFormulario();
            cargarInventario();
        }

        // Sincronización automática cada 3 segundos con la base de datos
        setInterval(cargarInventario, 3000);

        cargarInventario();
    </script>
</body>
</html>
